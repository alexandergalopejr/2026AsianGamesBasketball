<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Asian Games Basketball Scores</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 24px;
            font-size: 24px;
            text-align: center;
        }
        #container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .match-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #334155;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 700;
            color: #f59e0b;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        .scoreboard {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .team {
            flex: 1;
            font-size: 18px;
            font-weight: 600;
        }
        .team.left { text-align: left; }
        .team.right { text-align: right; }
        .scores {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 32px;
            font-weight: 800;
            font-family: monospace;
            color: #ffffff;
        }
        .divider { color: #64748b; font-size: 20px; }
        .loading { text-align: center; color: #94a3b8; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>🏆 Asian Games Basketball Live Tracker</h1>
    <div id="container">
        <div class="loading">Connecting to manual live data source...</div>
    </div>

    <script>
        // Paste your deployed Google Apps Script URL here
        const API_URL = "https://script.google.com/macros/s/AKfycbxcgzj6fF4S63svYX5jumVu_95I5LKw8cLnqBgY7lf3ybNLCA8L9yEYR4fwApjCc4nh/exec"; 

        async function fetchScores() {
    try {
        // Force the browser to follow Google's redirect rules smoothly
        const response = await fetch(API_URL, { method: 'GET', redirect: 'follow' });
        const matches = await response.json();
        
        const container = document.getElementById('container');
        container.innerHTML = ''; 

        matches.forEach(match => {
            if (!match.Team_A || !match.Team_B) return;

            const card = document.createElement('div');
            card.className = 'match-card';
            
            const quarter = match.Quarter || "UPCOMING";
            const time = match.Time_Remaining || "00:00";
            const scoreA = match.Score_A !== "" ? match.Score_A : "0";
            const scoreB = match.Score_B !== "" ? match.Score_B : "0";

            card.innerHTML = `
                <div class="status-bar">
                    <span>${quarter}</span>
                    <span>⏱️ ${time}</span>
                </div>
                <div class="scoreboard">
                    <div class="team left">${match.Team_A}</div>
                    <div class="scores">
                        <span>${scoreA}</span>
                        <span class="divider">-</span>
                        <span>${scoreB}</span>
                    </div>
                    <div class="team right">${match.Team_B}</div>
                </div>
            `;
            container.appendChild(card);
        });
    } catch (error) {
        console.error("Error fetching live scores:", error);
        document.getElementById('container').innerHTML = `<div class="loading">Connection error. Retrying...</div>`;
    }
}

// Run loops
fetchScores();
setInterval(fetchScores, 5000);
    </script>
</body>
</html>
